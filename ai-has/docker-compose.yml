services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ai-has-backend
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false   # works out of the box; copy .env.example to .env to customise
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/ai_has.db}
      - CHROMA_PERSIST_DIR=${CHROMA_PERSIST_DIR:-./data/chroma}
      - KNOWLEDGE_BASE_DIR=/app/knowledge_base
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      # DEMO ONLY: lets the UI role switcher send X-User-Role headers. Set to false and provide
      # strong JWT_SECRET / WEBHOOK_SIGNING_SECRET for anything beyond a local demo.
      - ALLOW_HEADER_ROLE_AUTH=${ALLOW_HEADER_ROLE_AUTH:-true}
      - JWT_SECRET=${JWT_SECRET:-ai-has-enterprise-dev-secret-change-in-production}
      - WEBHOOK_SIGNING_SECRET=${WEBHOOK_SIGNING_SECRET:-ai-has-webhook-hmac-secret}
    volumes:
      - ai_has_data:/app/data
      - ./knowledge_base:/app/knowledge_base
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: ai-has-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ai_has_data:
