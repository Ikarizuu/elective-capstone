# Render Blueprint for the AI-HAS FastAPI backend (the frontend is deployed on Vercel).
# Render > New > Blueprint > pick this repo. It asks for the values marked `sync: false`.
services:
  - type: web
    name: ai-has-backend
    runtime: docker
    plan: free
    dockerfilePath: ./ai-has/backend/Dockerfile
    dockerContext: ./ai-has
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_CHAT_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false # secret: entered in the Render dashboard, never committed
      - key: BACKEND_CORS_ORIGINS
        sync: false # your Vercel URL, e.g. https://ai-has.vercel.app
      # DEMO ONLY: keeps the UI role switcher working. Anyone with the URL can act as admin.
      - key: ALLOW_HEADER_ROLE_AUTH
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: WEBHOOK_SIGNING_SECRET
        generateValue: true
