name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests + evaluation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-has
    env:
      OPENAI_API_KEY: ""   # offline, deterministic mode: no secrets needed
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-has/backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Unit + integration tests
        run: python -m pytest tests -q

      - name: Evaluation harness (quality gates)
        run: python tests/evaluate.py

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: |
            ai-has/docs/EVALUATION.md
            ai-has/tests/eval_results.json
          if-no-files-found: warn

  frontend:
    name: Frontend type-check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-has/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ai-has/frontend/package-lock.json

      - run: npm ci

      # `next build` runs the TypeScript type-check and compiles every route.
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_TELEMETRY_DISABLED: "1"

  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: ai-has
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Wait for backend health
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8000/api/health; then echo; exit 0; fi
            sleep 3
          done
          echo "Backend did not become healthy" >&2
          docker compose logs backend
          exit 1

      - name: Smoke test API (chat + RBAC)
        run: |
          curl -fsS -X POST http://localhost:8000/api/chat \
            -H 'Content-Type: application/json' -H 'X-User-Role: employee' \
            -d '{"message":"My VPN fails with error VPN-412"}' | grep -q '"citations"'
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'X-User-Role: employee' http://localhost:8000/api/analytics/summary)
          test "$code" = "403"

      - name: Smoke test frontend
        run: curl -fsS http://localhost:3000 | grep -qi "ai-has"

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
